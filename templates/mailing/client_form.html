{% extends 'base.html' %}

{% block title %}{% if object %}Изменить клиента{% else %}Добавить клиента{% endif %}{% endblock %}

{% block content %}
<h1>{% if object %}Изменить клиента{% else %}Добавить клиента{% endif %}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{% url 'mailing:client_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
